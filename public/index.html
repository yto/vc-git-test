<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff0080, #ff8c00, #40e0d0, #7b2ff7);
      background-size: 400% 400%;
      animation: bg 8s ease infinite;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }
    h1 {
      margin: 0;
      font-size: clamp(3rem, 14vw, 10rem);
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 10px #fff, 0 0 30px #ff0080, 0 0 60px #7b2ff7;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .star {
      position: absolute;
      font-size: 2rem;
      animation: float 4s ease-in-out infinite;
    }
    .star:nth-of-type(1) { top: 10%; left: 12%; }
    .star:nth-of-type(2) { top: 20%; right: 15%; animation-delay: .8s; }
    .star:nth-of-type(3) { bottom: 15%; left: 20%; animation-delay: 1.6s; }
    .star:nth-of-type(4) { bottom: 12%; right: 10%; animation-delay: 2.4s; }
    @keyframes bg { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @keyframes pulse { 0%, 100% { transform: scale(1) rotate(-2deg); } 50% { transform: scale(1.1) rotate(2deg); } }
    @keyframes float { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-30px) rotate(180deg); } }
  </style>
</head>
<body>
  <span class="star">✨</span>
  <span class="star">🌟</span>
  <span class="star">🎉</span>
  <span class="star">💫</span>
  <h1>Hello World</h1>
</body>
</html>
